version = 1

# Inline HTML comment headers render visibly in some markdown viewers.
[[annotations]]
path = "**/*.md"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Alex Brandt"
SPDX-License-Identifier = "MIT"

# The root license stays in its conventional form; REUSE reads the
# SPDX-canonical text from LICENSES/MIT.txt.
[[annotations]]
path = "LICENSE"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Alex Brandt"
SPDX-License-Identifier = "MIT"
