---
# Install: pre-commit install --hook-type pre-commit --hook-type commit-msg
# Run manually: pre-commit run --all-files
# Update pins: pre-commit autoupdate
#
# The commit-msg hook type is not optional here: release-plz derives the
# version bump and changelog from commit subjects, so a non-conventional
# subject reaching main silently corrupts the next release.

# Hooks are added when the repo gains something for them to check, not in
# anticipation of it. A hook with no matching files cannot be exercised,
# so its arguments and config are unjustified guesses. Pending additions
# are tracked on the issue that introduces the file type: TOML/taplo on
# #1, markdown/markdownlint on #4, JSON/check-json on #5, and shell
# scripts/shellcheck on #24.

exclude: |
  (?x)^(
    \.git/.*|
    CHANGELOG\.md
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-case-conflict

      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]

      - id: check-yaml

      - id: check-shebang-scripts-are-executable

  # No `-d relaxed` arg: yamllint's -d overrides file discovery entirely,
  # which would make .yamllint.yaml dead config. The file extends relaxed
  # itself, so the tuning there is what applies.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  # actionlint owns workflow YAML validation (schema, expression syntax,
  # shellcheck over run: blocks); check-yaml and yamllint cover the basic
  # parse and style smells on the same files.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
