---
# Named for when it fires, so a check on this cadence adds a job here
# rather than a workflow file of its own.
#
# The push trigger populates the hook-environment cache: a branch
# restores caches only from itself or the default branch.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  hooks:
    name: Run every pre-commit hook
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install lychee
        run: ./scripts/install-lychee.sh

      # The clippy hook compiles every dependency.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # SHA pinning is transitive: an action whose own action.yml references
      # another by tag fails the run at resolution, before any step executes.
      # This fork pins its own, which pre-commit/action does not.
      - name: Run hooks
        uses: tox-dev/action-pre-commit-uv@e09b8958484dfe71f4ac3bc7afb230ba506402ec # v1.0.5

  build:
    name: Build the WASM plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: cargo build --release --locked

      # Load it with docs/how-to/build-the-plugin.md to try a PR by hand.
      - name: Upload plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zellij-claude-pair
          path: target/wasm32-wasip1/release/zellij_claude_pair.wasm
          if-no-files-found: error
          retention-days: 7

  deny:
    name: Check dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cargo-deny
        run: ./scripts/install-cargo-deny.sh

      - name: Check dependencies
        run: cargo deny --locked check

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # cargo deny enforces the same list.
      - name: Read license allow-list
        id: licenses
        run: >-
          python3 -c 'import tomllib;
          print("allow=" + ", ".join(tomllib.load(open("deny.toml", "rb"))["licenses"]["allow"]))'
          >> "$GITHUB_OUTPUT"

      # This check also sees host-only crates and actions, which cargo deny
      # skips. Each one outside the list needs an entry here.
      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          allow-licenses: ${{ steps.licenses.outputs.allow }}
          allow-dependencies-licenses: >-
            pkg:cargo/doctest-file,
            pkg:cargo/encoding_rs,
            pkg:cargo/mock_instant,
            pkg:cargo/notify,
            pkg:cargo/recvmsg,
            pkg:githubactions/Swatinem/rust-cache
