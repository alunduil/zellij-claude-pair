---
name: Daily

on:
  schedule:
    # Only a failed run sends email, so a daily run adds no noise.
    - cron: "0 9 * * *"
      timezone: Europe/London
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate-liveness:
    name: Check Renovate liveness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Renovate liveness
        id: liveness
        uses: ./.github/actions/check-renovate-liveness

      - name: Fail if Renovate has stopped
        if: steps.liveness.outputs.problem != ''
        env:
          PROBLEM: ${{ steps.liveness.outputs.problem }}
        run: |
          echo "::error::${PROBLEM}"
          exit 1
