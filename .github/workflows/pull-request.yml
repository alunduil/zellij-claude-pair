---
# Named by trigger, not by tool, so it stays the home for every-change
# checks as they arrive: the Rust gates in #2 and the dependency review
# in #26 land here as additional jobs rather than as new workflow files.
# Cadence-named siblings to come: weekly.yml (#24), release.yml (#3).
# PR-title validation (#25) stays separate because it needs the `edited`
# action type, which would re-run these jobs on every title tweak.
name: Pull Request

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  hooks:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # pre-commit/action is unusable here: it calls actions/cache@v4 by
      # tag internally, and the repo requires every action be pinned to a
      # full SHA. These steps are what it does, with the cache pinned.
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6

      - name: Cache hook environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run hooks
        run: pre-commit run --all-files --show-diff-on-failure
