---
# Named by trigger, not by tool, so it stays the home for every-change
# checks as they arrive: the Rust gates in #2 and the dependency review
# in #26 land here as additional jobs rather than as new workflow files.
# Cadence-named siblings to come: weekly.yml (#24), release.yml (#3).
# PR-title validation (#25) stays separate because it needs the `edited`
# action type, which would re-run these jobs on every title tweak.
name: Pull Request

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  hooks:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
