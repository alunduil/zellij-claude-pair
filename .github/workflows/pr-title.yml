---
# Squash merge takes the commit subject from the PR title, so the title is
# what release-plz reads on main; the commit-msg hook never sees it.
#
# Kept out of ci.yml: retitling fires the edited action type, which should
# not re-run CI.
name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Enforce Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read

    steps:
      # Matches conventional-pre-commit's default types, so the commit-msg
      # hook and this check accept the same subjects.
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
