---
name: Weekly

on:
  schedule:
    - cron: "0 18 * * 5"
      timezone: Europe/London
  workflow_dispatch:

permissions:
  contents: read

# Ref-less so a manual dispatch and the schedule cannot race on the shared
# report issue.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # External URLs rot independently of our diffs, so breakage is reported
  # rather than blocking.
  external-links:
    name: Check external links
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check external links
        id: links
        uses: ./.github/actions/check-external-links

      - name: Find existing report issue
        if: steps.links.outputs.broken-links == 'true'
        id: report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search 'Link Checker Report in:title' --json number --jq '.[0].number // empty')
          echo "number=${number}" >> "${GITHUB_OUTPUT}"

      - name: Open or update report issue
        if: steps.links.outputs.broken-links == 'true'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          issue-number: ${{ steps.report.outputs.number }}
          labels: documentation
