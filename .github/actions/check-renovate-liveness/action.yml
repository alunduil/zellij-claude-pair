---
# Hosted Renovate never retries a failed job and reports the failure nowhere.
# Renovate edits the Dependency Dashboard issue as updates change, so an
# untouched dashboard is the only sign that it has stopped.
name: Check Renovate liveness
description: Fail if the Dependency Dashboard is missing or stale.

inputs:
  preview:
    description: >-
      Warn instead of failing on a stale dashboard, so a Renovate outage
      doesn't turn every pull request red.
    default: "false"

runs:
  using: composite
  steps:
    - name: Fail if the Dependency Dashboard is stale
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PREVIEW: ${{ inputs.preview }}
      with:
        script: |
          const STALE_DAYS = 10;
          const MS_PER_DAY = 86_400_000;
          const report = process.env.PREVIEW === 'true' ? core.warning : core.setFailed;

          const q = [
            `repo:${context.repo.owner}/${context.repo.repo}`,
            'is:issue',
            'is:open',
            'in:title "Dependency Dashboard"',
            'author:app/renovate',
          ].join(' ');

          const { data } = await github.rest.search.issuesAndPullRequests({ q });
          const dashboard = data.items[0];

          if (!dashboard) {
            report(
              'No open Dependency Dashboard: Renovate is uninstalled or ' +
              'disabled on this repository. Reinstall the app or re-enable ' +
              'the repository.',
            );
            return;
          }

          const ageDays = (Date.now() - new Date(dashboard.updated_at)) / MS_PER_DAY;
          const summary =
            `Dependency Dashboard #${dashboard.number} last updated ` +
            `${ageDays.toFixed(1)} days ago`;

          if (ageDays > STALE_DAYS) {
            report(
              `${summary}: Renovate has likely stopped running. Read the ` +
              'Mend job log, then tick the manual-run box on the dashboard.',
            );
            return;
          }

          core.info(`${summary}, within the ${STALE_DAYS}-day window.`);
