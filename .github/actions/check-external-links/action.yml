---
# External URLs rot independently of our diffs, so a broken link sets the
# exit-code output rather than failing the step. Needs a checkout.
name: Check external links
description: Run lychee over every Markdown file and write lychee/out.md.

outputs:
  exit-code:
    description: lychee's exit code; nonzero means lychee/out.md lists breakage.
    value: ${{ steps.lychee.outputs.exit_code }}

runs:
  using: composite
  steps:
    # `key` and `restore-keys` must share a prefix, or every restore misses
    # silently.
    - name: Derive the lychee cache prefix
      id: lychee-cache
      shell: bash
      run: echo "prefix=lychee-${{ hashFiles('lychee.toml') }}" >>"${GITHUB_OUTPUT}"

    # lychee expires entries after a day, so only a same-day re-dispatch
    # reuses them, sparing rate-limited hosts a second sweep.
    - name: Cache lychee results
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .lycheecache
        key: ${{ steps.lychee-cache.outputs.prefix }}-${{ github.run_id }}
        restore-keys: |
          ${{ steps.lychee-cache.outputs.prefix }}-

    - name: Set up lychee
      uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      with:
        install_args: github:lycheeverse/lychee

    - name: Check all links
      id: lychee
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        mkdir -p lychee
        exit_code=0
        lychee --no-progress --format markdown --output lychee/out.md "**/*.md" || exit_code=$?
        echo "exit_code=${exit_code}" >>"${GITHUB_OUTPUT}"
