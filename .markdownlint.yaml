---
# Every entry here needs a reason that holds for this repo. Rules are not
# disabled pre-emptively to stop them firing — a violation is a prompt to
# rewrite the prose, matching the rule-tuning policy vale adopts in #23.
default: true

# ATX headings (# Heading), matching house style across the other repos.
MD003:
  style: atx

# Code blocks, headings, and tables cannot be wrapped without changing
# what they mean. Prose stays gated at the default 80 columns.
MD013:
  code_blocks: false
  headings: false
  tables: false

# Repeated headings are fine under different parents.
MD024:
  siblings_only: true
