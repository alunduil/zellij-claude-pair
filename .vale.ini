# After changing Packages, run `vale sync` and commit the result.
#
# Rule-tuning policy:
#   - Rules keep the severity their package ships. When a rule fires,
#     rewrite the prose to comply.
#   - Exceptions: disable rules that duplicate another package's, and pin
#     inclusion rules at `error`.

StylesPath = .vale/styles
MinAlertLevel = warning
Packages = Microsoft, proselint, write-good, alex, Readability
Vocab = zellij-claude-pair

[*.md]
BasedOnStyles = Vale, Microsoft, proselint, write-good, alex, Readability

# Duplicates write-good.Passive.
Microsoft.Passive = NO

# Duplicates Microsoft.Terms.
proselint.Cliches = NO

# Duplicates Vale.Spelling.
proselint.Spelling = NO

# alex ships these at warning, which never fails the pre-commit hook.
alex.Race = error
alex.Gendered = error
alex.LGBTQ = error
