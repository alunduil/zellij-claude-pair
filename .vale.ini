# https://vale.sh/docs/topics/config/
#
# Packages are vendored under .vale/styles and excluded from pre-commit, so
# the hook needs no `vale sync`. Run `vale sync` by hand after changing
# Packages and commit the result.
#
# Rule-tuning policy:
#   - Rules keep the severity their package ships. When a rule fires,
#     rewrite the prose to comply rather than demote the rule.
#   - Exceptions: dedupe rules duplicated across overlapping packages, and
#     pin inclusion rules at `error`.

StylesPath = .vale/styles
MinAlertLevel = warning
Packages = Microsoft, proselint, write-good, alex, Readability
Vocab = zellij-claude-pair

[*.md]
BasedOnStyles = Vale, Microsoft, proselint, write-good, alex, Readability

# write-good.Passive is the keeper.
Microsoft.Passive = NO

# Microsoft.Terms covers the same ground.
proselint.Cliches = NO

# Vale.Spelling owns spelling.
proselint.Spelling = NO

# Pinned to `error` so an upstream severity drop cannot silently weaken them.
alex.Race = error
alex.Gendered = error
alex.LGBTQ = error
